<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Your Name] - Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    #app { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(10, 10, 15, 0.75);
      color: #e8e8f0;
      font-family: 'Space Mono', 'Courier New', monospace;
      text-align: center; cursor: pointer; z-index: 10;
      transition: opacity 0.4s ease;
    }
    #overlay h1 {
      font-size: 1.8rem; letter-spacing: 0.15em; color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6); margin-bottom: 1rem;
    }
    #overlay p { font-size: 0.9rem; color: #b8b8c8; max-width: 320px; line-height: 1.6; }
    #overlay .key {
      display: inline-block; border: 1px solid #ff2ec4; color: #ff2ec4;
      padding: 2px 8px; border-radius: 3px; margin: 0 2px; font-size: 0.8rem;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #hud {
      position: absolute; bottom: 20px; left: 20px;
      font-family: 'Space Mono', monospace; font-size: 0.7rem;
      color: #00f0ff88; letter-spacing: 0.1em; z-index: 5; pointer-events: none;
    }
    .touch-only { display: none; }
    body.touch .desktop-only { display: none; }
    body.touch .touch-only { display: block; }
    .touch-ui { display: none; }
    body.touch .touch-ui { display: block; }
    #joystick {
      position: absolute; left: 24px; bottom: 24px;
      width: 120px; height: 120px; z-index: 6; touch-action: none;
    }
    #joystick-base {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(0, 240, 255, 0.35);
      background: rgba(0, 240, 255, 0.06);
    }
    #joystick-knob {
      position: absolute; left: 35px; top: 35px; width: 50px; height: 50px;
      border-radius: 50%; background: rgba(0, 240, 255, 0.2);
      border: 1px solid #00f0ff;
    }
    #look-zone {
      position: absolute; right: 0; top: 0; width: 55%; height: 100%;
      z-index: 4; touch-action: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="overlay">
      <h1>[YOUR NAME]</h1>
      <p class="desktop-only">
        Click to enter<br /><br />
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to move
        &nbsp;&middot;&nbsp; mouse to look &nbsp;&middot;&nbsp; <span class="key">ESC</span> to exit
      </p>
      <p class="touch-only">
        Tap to enter<br /><br />
        Left joystick to move &nbsp;&middot;&nbsp; drag right side to look
      </p>
    </div>
    <div id="hud">SECTOR 00 - VOID</div>
    <div id="joystick" class="touch-ui">
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
    </div>
    <div id="look-zone" class="touch-ui"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
