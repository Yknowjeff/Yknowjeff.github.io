<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Jeff Portfolio — Interactive 3D Portfolio</title>
        <link rel="icon" type="image/png" href="/social/Ghost.png" />
        <link rel="stylesheet" href="./sources/style.css">

        <meta itemprop="name" content="Jeff Portfolio">
        <meta itemprop="description" content="An interactive 3D portfolio you explore, not just scroll — walk a controllable character through a procedurally generated world to browse projects and achievements.">
        <meta itemprop="image" content="https://ionlyknows.github.io/projects/3D.png">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Jeff Portfolio — Interactive 3D Portfolio">
        <meta name="twitter:description" content="An interactive 3D portfolio you explore, not just scroll — built with Three.js and Vue.">
        <meta name="twitter:image" content="https://ionlyknows.github.io/projects/3D.png">

        <meta property="og:site_name" content="Jeff Portfolio">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://ionlyknows.github.io/">
        <meta property="og:title" content="Jeff Portfolio — Interactive 3D Portfolio">
        <meta property="og:description" content="An interactive 3D portfolio you explore, not just scroll — walk a controllable character through a procedurally generated world to browse projects and achievements.">
        <meta property="og:image" content="https://ionlyknows.github.io/projects/3D.png">
    </head>
    <body>
        <div class="game">
            <div class="ui">
                <div class="mobile-warning">
                    For a better experience with 3D world interaction, open this portfolio on a desktop.
                </div>
                <div class="controls">
                    <div class="group">
                        <div class="element">
                            <div class="keys is-arrows">
                                <div class="key">A</div>
                                <div class="key">S</div>
                                <div class="key">D</div>
                                <div class="key">W</div>
                            </div>
                            move
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">F</div>
                            </div>
                            fullscreen
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">P</div>
                            </div>
                            pointer lock
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">V</div>
                            </div>
                            view mode
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">B</div>
                            </div>
                            settings
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./sources/index.js"></script>
    </body>
</html>
